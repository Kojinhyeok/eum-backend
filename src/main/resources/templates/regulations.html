<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle + ' | 인사이트 | 이음인사이트'}, '미국 FDA MoCRA, EU/UK CPNP·SCPN, 아세안 ACD 등 국가별 화장품 규정 개정 사항과 규제 영향, 체크포인트를 정리해 공유합니다.')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('regulations')}"></header>

<main>
    <!-- ===== 페이지 제목 ===== -->
    <section class="page-hero">
        <div class="container-x relative py-12 md:py-14">
            <span class="kicker">Insights</span>
            <h1 class="h-page mt-3" th:text="${pageTitle}" th:attr="data-en=${pageTitleEn}">글로벌 규제동향</h1>
        </div>
    </section>

    <nav th:replace="~{fragments/layout :: insightTabs('REGULATIONS')}"></nav>

    <section id="list" class="section !pt-8 bg-white md:!pt-10">
        <div class="container-x">
            <!-- 국가 필터 (이름·표시 여부: 관리자 > 메뉴·탭 관리) -->
            <nav class="no-scrollbar -mx-4 flex gap-2 overflow-x-auto px-4 sm:mx-0 sm:flex-wrap sm:px-0" aria-label="국가 필터">
                <a href="/regulations#list" class="filter-chip" th:classappend="${currentRegion == null} ? 'is-active'">전체</a>
                <a th:each="r : ${regions}" th:href="|/regulations?region=${r.code}#list|" href="#"
                   class="filter-chip" th:classappend="${currentRegion != null and currentRegion.code == r.code} ? 'is-active'">
                    <span th:text="${r.labelKo}" th:attr="data-en=${r.labelEn}">미국</span>
                </a>
            </nav>

            <!-- 목록 -->
            <ul th:if="${hasPosts}" class="mt-6 divide-y divide-line border-y border-primary/80">
                <li th:each="p : ${posts}">
                    <a th:href="${p.path}" href="#" class="group flex gap-4 py-5 sm:gap-6 sm:py-6">
                        <!-- 대표 이미지 (없으면 국가 코드) -->
                        <span class="reg-thumb">
                            <img th:if="${p.hasThumbnail}" th:src="${p.thumbnailUrl}" src="" alt="" loading="lazy">
                            <span th:unless="${p.hasThumbnail}" class="reg-thumb-code notranslate" translate="no" th:text="${p.region.shortCode}">US</span>
                        </span>
                        <span class="min-w-0 flex-1">
                            <span class="block line-clamp-2 text-[16px] font-bold leading-snug text-ink group-hover:text-primary group-hover:underline md:text-[18px]" th:text="${p.title}">제목</span>
                            <span class="mt-1.5 block line-clamp-2 text-[14px] leading-6 text-ink-soft" th:text="${p.excerpt}">요약</span>
                            <span class="mt-2.5 flex flex-wrap items-center gap-x-3 gap-y-1.5 text-[13px] text-ink-mute">
                                <span class="reg-tag" th:text="${@menuService.regionLabel(p.region)}" th:attr="data-en=${@menuService.regionLabelEn(p.region)}">미국</span>
                                <span th:if="${p.hasCategory}" th:text="${p.category}">최신 개정/고시</span>
                                <span th:text="${p.dateLabel}">2026.11.16</span>
                            </span>
                        </span>
                    </a>
                </li>
            </ul>

            <div th:unless="${hasPosts}" class="mt-6 rounded-lg border border-line px-6 py-16 text-center">
                <p class="text-[15px] font-semibold text-ink">등록된 글이 없습니다.</p>
                <p class="mt-1 text-[13px] text-ink-mute">다른 국가를 선택하거나 잠시 후 다시 확인해 주세요.</p>
            </div>

            <!-- 페이지네이션 -->
            <nav th:if="${totalPages > 1}" class="mt-10 flex flex-wrap items-center justify-center gap-1.5" aria-label="페이지">
                <a th:if="${hasPrev}" th:href="|/regulations?page=${currentPage - 1}${regionQuery}#list|" href="#" class="page-btn" aria-label="이전 페이지">
                    <span class="material-symbols-outlined notranslate text-[20px]" translate="no" aria-hidden="true">chevron_left</span>
                </a>
                <a th:each="n : ${pageNumbers}" th:href="|/regulations?page=${n}${regionQuery}#list|" href="#"
                   class="page-btn" th:classappend="${n == currentPage} ? 'is-active'" th:text="${n + 1}">1</a>
                <a th:if="${hasNext}" th:href="|/regulations?page=${currentPage + 1}${regionQuery}#list|" href="#" class="page-btn" aria-label="다음 페이지">
                    <span class="material-symbols-outlined notranslate text-[20px]" translate="no" aria-hidden="true">chevron_right</span>
                </a>
            </nav>
        </div>
    </section>

    <section th:replace="~{fragments/layout :: cta('GLOBAL')}"></section>
</main>

<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
