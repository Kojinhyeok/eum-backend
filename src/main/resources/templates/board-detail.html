<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${post.title + ' | ' + board.label + ' | 이음인사이트'}, ${post.excerpt})}"></head>
<body>
<header th:replace="~{fragments/layout :: header(${activeMenu})}"></header>

<main>
    <th:block th:if="${isInsights}">
        <nav th:replace="~{fragments/layout :: insightTabs(${board.code})}"></nav>
    </th:block>
    <th:block th:unless="${isInsights}">
        <nav th:replace="~{fragments/layout :: noticeTabs(${board.code})}"></nav>
    </th:block>

    <article class="section !pt-10 bg-white md:!pt-14">
        <div class="container-x max-w-3xl">
            <a th:href="${board.path}" href="#" class="inline-flex items-center gap-1 text-[14px] font-bold text-primary hover:underline">
                <span class="material-symbols-outlined notranslate text-[18px]" translate="no" aria-hidden="true">arrow_back</span>
                <span th:text="${board.label}">화장품 연구동향</span>
            </a>

            <header class="mt-5 border-b border-primary/80 pb-6">
                <h1 class="text-[26px] font-extrabold leading-snug tracking-tight text-ink md:text-[32px]" th:text="${post.title}">제목</h1>
                <p class="mt-3 flex items-center gap-3 text-[13px] text-ink-mute">
                    <span th:text="${post.dateLabel}">2026.11.06</span>
                    <span class="h-3 w-px bg-line-strong"></span>
                    <span>조회 <span th:text="${post.viewCount}">0</span></span>
                </p>
            </header>

            <!-- 본문: 관리자 에디터 HTML (저장 시 서버에서 정리됨) -->
            <div class="board-content py-8" th:utext="${post.contentHtml}">본문</div>

            <!-- 첨부파일 -->
            <div th:if="${post.hasAttachments}" class="mb-8 rounded-lg border border-line bg-surface-low p-4 md:p-5">
                <p class="flex items-center gap-1.5 text-[14px] font-bold text-ink">
                    <span class="material-symbols-outlined notranslate text-[18px] text-primary" translate="no" aria-hidden="true">attach_file</span>
                    첨부파일 <span class="text-primary" th:text="${#lists.size(post.attachments)}">2</span>
                </p>
                <ul class="mt-3 space-y-2">
                    <li th:each="f : ${post.attachments}">
                        <a th:href="${f.url}" href="#" target="_blank" rel="noopener" download
                           class="group flex items-center gap-3 rounded-md border border-line bg-white px-3 py-2.5 transition-colors hover:border-primary">
                            <span class="w-12 shrink-0 rounded bg-lime-soft px-1.5 py-1 text-center text-[11px] font-bold leading-none text-primary-deep notranslate" translate="no" th:text="${f.extLabel}">PDF</span>
                            <span class="min-w-0 flex-1 truncate text-[14px] font-medium text-ink group-hover:text-primary notranslate" translate="no" th:text="${f.name}">파일명.pdf</span>
                            <span class="hidden shrink-0 text-[12px] text-ink-mute sm:inline" th:text="${f.sizeLabel}">1.2 MB</span>
                            <span class="material-symbols-outlined notranslate shrink-0 text-[20px] text-ink-mute group-hover:text-primary" translate="no" aria-hidden="true">download</span>
                        </a>
                    </li>
                </ul>
            </div>

            <div th:if="${post.hasLink}" class="border-t border-line pt-6">
                <a th:href="${post.linkUrl}" href="#" target="_blank" rel="noopener" class="btn btn-outline">
                    관련 링크 바로가기
                    <span class="material-symbols-outlined notranslate text-[18px]" translate="no" aria-hidden="true">north_east</span>
                </a>
            </div>

            <div class="mt-10 flex justify-center border-t border-line pt-8">
                <a th:href="${board.path}" href="#" class="btn btn-primary">목록으로</a>
            </div>
        </div>
    </article>
</main>

<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
