spring.application.name=eum

# ===== DB (운영: RDS MariaDB, 값은 /etc/eum.env 환경변수로 주입) =====
spring.datasource.url=jdbc:mariadb://${DB_HOST}:3306/${DB_NAME:eumdb}?sslMode=trust
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ===== 관리자 초기 계정 (최초 1회만 생성됨) =====
admin.init.username=${ADMIN_INIT_USERNAME:admin}
admin.init.password=${ADMIN_INIT_PASSWORD:changeme1234}

# ===== 화면 =====
spring.thymeleaf.cache=true
server.servlet.session.timeout=2h

# Nginx 리버스 프록시 뒤에서 https/host 헤더 인식
server.forward-headers-strategy=framework
