<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<meta name="robots" content="noindex, nofollow">
	<title>글로벌 규제동향 관리 - 이음인사이트</title>
	<link href="../css/app.css" rel="stylesheet">
	<link href="../css/custom.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/suneditor@2.47.12/dist/css/suneditor.min.css" rel="stylesheet">
	<style>
		.sun-editor { font-family: inherit; }
		.sun-editor-editable { font-size: 15px; line-height: 1.8; }
		.sun-editor-editable table td, .sun-editor-editable table th { border: 1px solid #dfe3e7; }
		.thumb-preview { width: 160px; height: 110px; border-radius: .3rem; background: #263F56; color: #fff;
			display: flex; align-items: center; justify-content: center; overflow: hidden; font-weight: 700; font-size: 20px; }
		.thumb-preview img { width: 100%; height: 100%; object-fit: cover; }
		.editor-busy { opacity: .6; pointer-events: none; }
	</style>
</head>

<body data-page="regulation-list" data-base="../">
<div class="wrapper">
	<div id="sidebar-container"></div>
	<div class="main">
		<div id="header-container"></div>

		<main class="content">
			<div class="container-fluid p-0">
				<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
					<h1 class="h3 mb-0"><strong>글로벌 규제동향 (국가별) 관리</strong></h1>
					<div class="d-flex gap-2">
						<a href="/regulations" target="_blank" class="btn btn-outline-secondary">홈페이지에서 보기</a>
						<button type="button" class="btn btn-primary" onclick="openForm()">+ 새 글 등록</button>
					</div>
				</div>

				<div class="card mb-3">
					<div class="card-body py-3 d-flex flex-wrap align-items-center gap-2">
						<label for="filterRegion" class="mb-0 small text-muted">권역</label>
						<select id="filterRegion" class="form-select form-select-sm" style="width:auto;" onchange="renderTable()">
							<option value="">전체</option>
						</select>
						<span class="small text-muted ms-auto" id="countLabel"></span>
					</div>
				</div>

				<div class="card">
					<div class="table-responsive">
						<table class="table table-hover my-0" id="regulationTable">
							<thead>
							<tr>
								<th style="width:110px;">업데이트일</th>
								<th style="width:110px;">권역</th>
								<th style="width:140px;">구분</th>
								<th>제목</th>
								<th style="width:80px;">상태</th>
								<th style="width:130px;">관리</th>
							</tr>
							</thead>
							<tbody></tbody>
						</table>
					</div>
				</div>
			</div>
		</main>
	</div>
</div>

<!-- 등록/수정 모달 -->
<div class="modal fade" id="formModal" tabindex="-1" aria-hidden="true" data-bs-focus="false" data-bs-backdrop="static">
	<div class="modal-dialog modal-dialog-scrollable modal-xl">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="formTitle">새 글 등록</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<form id="regulationForm" onsubmit="return false;">
					<input type="hidden" id="postId">
					<div class="row g-3">
						<div class="col-md-4">
							<label class="form-label required" for="fRegion">권역</label>
							<select class="form-select" id="fRegion"></select>
						</div>
						<div class="col-md-4">
							<label class="form-label" for="fCategory">구분 배지</label>
							<input class="form-control" id="fCategory" list="categoryList" maxlength="50" placeholder="최신 개정/고시">
							<datalist id="categoryList">
								<option value="최신 개정/고시">
								<option value="가이드라인 반영">
								<option value="긴급 고시 대응">
								<option value="규정 DB 동기화">
								<option value="시행 예정">
							</datalist>
						</div>
						<div class="col-md-4">
							<label class="form-label required" for="fDate">업데이트일</label>
							<input class="form-control" type="date" id="fDate">
						</div>

						<div class="col-12">
							<label class="form-label required" for="fTitle">제목</label>
							<input class="form-control" id="fTitle" maxlength="200" placeholder="예: FDA, MoCRA에 따른 화장품 강제 리콜 최종 가이드라인 발표">
						</div>
						<div class="col-md-6">
							<label class="form-label" for="fEffective">시행/적용 시점</label>
							<input class="form-control" id="fEffective" maxlength="100" placeholder="예: 2027년 1월 1일 시행">
						</div>
						<div class="col-md-6">
							<label class="form-label" for="fSourceUrl">규정 원문 링크</label>
							<input class="form-control" id="fSourceUrl" maxlength="500" placeholder="https://">
							<div class="form-hint">입력하면 글 하단에 ‘규정 원문 보기’ 버튼이 표시됩니다.</div>
						</div>
						<div class="col-12">
							<label class="form-label" for="fSummary">목록 요약</label>
							<textarea class="form-control" id="fSummary" rows="2" maxlength="500" placeholder="비워두면 본문 앞부분이 자동으로 들어갑니다."></textarea>
							<div class="form-hint">목록과 메인 페이지에 1~2줄로 보이는 문장입니다.</div>
						</div>
						<div class="col-12">
							<label class="form-label">대표 이미지 (선택)</label>
							<div class="d-flex flex-wrap align-items-center gap-3">
								<div class="thumb-preview" id="thumbPreview">US</div>
								<div class="d-flex flex-column gap-2">
									<div class="d-flex gap-2">
										<button type="button" class="btn btn-sm btn-outline-primary" onclick="pickThumb()">이미지 올리기</button>
										<button type="button" class="btn btn-sm btn-outline-secondary" onclick="setThumb('')">지우기</button>
									</div>
									<div class="form-hint mb-0">비워두면 국가 코드 박스로 표시됩니다. (JPG·PNG·WEBP, 10MB 이하)</div>
								</div>
							</div>
							<input type="hidden" id="fThumb">
						</div>
						<div class="col-12">
							<div class="d-flex justify-content-between align-items-end mb-1">
								<label class="form-label required mb-0" for="editor">본문</label>
								<button type="button" class="btn btn-sm btn-link p-0" onclick="insertTemplate()">기본 틀 다시 넣기</button>
							</div>
							<div id="editorWrap"><textarea id="editor"></textarea></div>
							<div class="form-hint">표·글자색·굵게·이미지를 쓸 수 있습니다. 쓰지 않는 소제목은 지워도 됩니다.</div>
						</div>
						<div class="col-12">
							<div class="form-check form-switch">
								<input class="form-check-input" type="checkbox" id="fPublished" checked>
								<label class="form-check-label" for="fPublished">홈페이지에 게시</label>
							</div>
						</div>
					</div>
					<div id="formError" class="alert alert-danger mt-3 mb-0 py-2 px-3" style="display:none;"></div>
				</form>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
				<button type="button" class="btn btn-primary" id="btnSave" onclick="savePost()">저장</button>
			</div>
		</div>
	</div>
</div>

<script src="../js/app.js"></script>
<script src="../js/common.js"></script>
<script src="https://cdn.jsdelivr.net/npm/suneditor@2.47.12/dist/suneditor.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/suneditor@2.47.12/src/lang/ko.js"></script>
<script>
	let regions = [];
	let posts = [];
	let editor;
	let uploading = 0;

	const IMAGE_MAX = 10 * 1024 * 1024;

	/* 새 글 본문 기본 틀 (쓰지 않는 소제목은 지우면 됨) */
	const TEMPLATE_HTML =
		'<h3>개정 내용</h3><p><br></p>' +
		'<h3>규제 영향</h3><p><br></p>' +
		'<h3>체크포인트</h3><ul><li><br></li></ul>';

	/* ===== 업로드 ===== */
	async function uploadImage(file) {
		const fd = new FormData();
		fd.append('file', file);
		const res = await fetch('/api/admin/upload/image', { method: 'POST', body: fd });
		const data = await res.json().catch(() => ({}));
		if (!res.ok) throw new Error(data.message || '이미지 업로드에 실패했습니다.');
		return data;
	}
	function setBusy(on) {
		uploading += on ? 1 : -1;
		document.getElementById('editorWrap').classList.toggle('editor-busy', uploading > 0);
		document.getElementById('btnSave').disabled = uploading > 0;
	}

	/* ===== 에디터 (SunEditor: 표·글자색·이미지) ===== */
	function initEditor() {
		editor = SUNEDITOR.create('editor', {
			lang: SUNEDITOR_LANG['ko'],
			width: '100%',
			minHeight: '360px',
			height: 'auto',
			maxHeight: '60vh',
			placeholder: '본문을 입력하세요.',
			formats: ['p', 'h3', 'h4', 'blockquote'],
			buttonList: [
				['undo', 'redo'],
				['formatBlock'],
				['bold', 'underline', 'italic', 'strike'],
				['fontColor', 'hiliteColor', 'removeFormat'],
				['align', 'list', 'table'],
				['link', 'image', 'horizontalRule'],
				['fullScreen']
			],
			imageFileInput: true,
			imageUrlInput: false,
			imageMultipleFile: false,
			imageAccept: '.jpg, .jpeg, .png, .gif, .webp',
			linkTargetNewWindow: true
		});
		editor.onImageUploadBefore = function (files, info, core, uploadHandler) {
			const f = files[0];
			if (!f) { uploadHandler(); return undefined; }
			if (f.size > IMAGE_MAX) { uploadHandler('이미지는 10MB 이하만 올릴 수 있습니다.'); return undefined; }
			setBusy(true);
			uploadImage(f)
				.then(d => uploadHandler({ result: [{ url: d.url, name: f.name, size: f.size }] }))
				.catch(err => uploadHandler(err.message))
				.finally(() => setBusy(false));
			return undefined;
		};
	}

	function editorHtml() {
		const html = editor.getContents(true);
		const box = document.createElement('div');
		box.innerHTML = html;
		const hasMedia = box.querySelector('img, table');
		if (!hasMedia && box.textContent.trim() === '') return '';
		return html;
	}

	function insertTemplate() {
		if (editorHtml() && !confirm('지금 본문을 지우고 기본 틀로 바꿀까요?')) return;
		editor.setContents(TEMPLATE_HTML);
	}

	/* ===== 대표 이미지 ===== */
	function setThumb(url) {
		setVal('fThumb', url);
		const box = document.getElementById('thumbPreview');
		if (url) {
			box.innerHTML = `<img src="${esc(url)}" alt="">`;
		} else {
			const r = regions.find(x => x.code === getVal('fRegion'));
			box.textContent = r ? r.shortCode : '';
		}
	}
	function pickThumb() {
		const input = document.createElement('input');
		input.type = 'file';
		input.accept = 'image/jpeg,image/png,image/gif,image/webp';
		input.onchange = () => {
			const f = input.files[0];
			if (!f) return;
			if (f.size > IMAGE_MAX) { alert('이미지는 10MB 이하만 올릴 수 있습니다.'); return; }
			setBusy(true);
			uploadImage(f).then(d => setThumb(d.url)).catch(err => alert(err.message)).finally(() => setBusy(false));
		};
		input.click();
	}

	function esc(s) {
		return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
	}
	function regionLabel(code) {
		const r = regions.find(x => x.code === code);
		return r ? r.label : code;
	}
	function today() {
		const d = new Date();
		return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
	}
	function toDateStr(v) {
		if (Array.isArray(v)) return v[0] + '-' + String(v[1]).padStart(2, '0') + '-' + String(v[2]).padStart(2, '0');
		return v ? String(v).substring(0, 10) : '';
	}

	document.addEventListener("DOMContentLoaded", function () {
		initEditor();
		fetch("/api/admin/regulations/regions")
			.then(res => res.json())
			.then(list => {
				regions = list;
				const opts = list.map(r => `<option value="${r.code}">${esc(r.label)} (${r.shortCode})${r.visible === 'false' ? ' - 숨김' : ''}</option>`).join('');
				document.getElementById("fRegion").innerHTML = opts;
				document.getElementById("filterRegion").insertAdjacentHTML('beforeend', opts);
				document.getElementById("fRegion").addEventListener('change', () => { if (!getVal('fThumb')) setThumb(''); });
				loadPosts();
			});
	});

	function loadPosts() {
		fetch("/api/admin/regulations")
			.then(res => res.json())
			.then(list => { posts = list; renderTable(); });
	}

	function renderTable() {
		const filter = document.getElementById("filterRegion").value;
		const list = filter ? posts.filter(p => p.region === filter) : posts;
		document.getElementById("countLabel").textContent = `총 ${list.length}건`;
		const tbody = document.querySelector("#regulationTable tbody");
		tbody.innerHTML = list.length === 0
			? '<tr><td colspan="6" class="text-center py-4">등록된 글이 없습니다.</td></tr>'
			: list.map(p => `
				<tr>
					<td class="align-middle">${esc(toDateStr(p.noticeDate))}</td>
					<td class="align-middle">${esc(regionLabel(p.region))}</td>
					<td class="align-middle">${esc(p.category)}</td>
					<td class="align-middle">${esc(p.title)}</td>
					<td class="align-middle">${p.published
						? '<span class="badge badge-new">게시</span>'
						: '<span class="badge badge-done">숨김</span>'}</td>
					<td class="align-middle">
						<button class="btn btn-sm btn-outline-primary" onclick="openForm(${p.id})">수정</button>
						<button class="btn btn-sm btn-outline-danger" onclick="deletePost(${p.id})">삭제</button>
					</td>
				</tr>`).join("");
	}

	function setVal(id, v) { document.getElementById(id).value = v ?? ''; }
	function getVal(id) { return document.getElementById(id).value; }

	function openForm(id) {
		document.getElementById("formError").style.display = "none";
		const p = id ? posts.find(x => x.id === id) : null;
		document.getElementById("formTitle").textContent = p ? "글 수정" : "새 글 등록";
		setVal("postId", p ? p.id : '');
		setVal("fRegion", p ? p.region : (regions[0] && regions[0].code));
		setVal("fCategory", p ? p.category : '최신 개정/고시');
		setVal("fDate", p ? toDateStr(p.noticeDate) : today());
		setVal("fTitle", p && p.title);
		setVal("fEffective", p && p.effectiveNote);
		setVal("fSummary", p && p.summary);
		setVal("fSourceUrl", p && p.sourceUrl);
		setThumb(p && p.thumbnailUrl ? p.thumbnailUrl : '');
		editor.setContents(p ? (p.content || '') : TEMPLATE_HTML);
		document.getElementById("fPublished").checked = p ? p.published : true;
		bootstrap.Modal.getOrCreateInstance(document.getElementById('formModal')).show();
	}

	function savePost() {
		const id = getVal("postId");
		const body = {
			region: getVal("fRegion"),
			category: getVal("fCategory"),
			noticeDate: getVal("fDate"),
			title: getVal("fTitle"),
			effectiveNote: getVal("fEffective"),
			summary: getVal("fSummary"),
			content: editorHtml(),
			thumbnailUrl: getVal("fThumb"),
			sourceUrl: getVal("fSourceUrl"),
			published: document.getElementById("fPublished").checked
		};
		const errBox = document.getElementById("formError");
		errBox.style.display = "none";
		if (!body.content) {
			errBox.textContent = "본문을 입력해 주세요.";
			errBox.style.display = "block";
			return;
		}
		const btn = document.getElementById("btnSave");
		btn.disabled = true;

		fetch(id ? `/api/admin/regulations/${id}` : "/api/admin/regulations", {
			method: id ? "PUT" : "POST",
			headers: { "Content-Type": "application/json" },
			body: JSON.stringify(body)
		})
			.then(async res => {
				const data = await res.json().catch(() => ({}));
				if (!res.ok) throw new Error(data.message || "저장 중 오류가 발생했습니다.");
				return data;
			})
			.then(() => {
				bootstrap.Modal.getOrCreateInstance(document.getElementById('formModal')).hide();
				loadPosts();
			})
			.catch(err => {
				errBox.textContent = err.message;
				errBox.style.display = "block";
			})
			.finally(() => { btn.disabled = false; });
	}

	function deletePost(id) {
		const p = posts.find(x => x.id === id);
		if (!confirm(`"${p ? p.title : ''}" 글을 삭제하시겠습니까?`)) return;
		fetch(`/api/admin/regulations/${id}`, { method: "DELETE" })
			.then(res => { if (res.ok) loadPosts(); else alert("삭제에 실패했습니다."); });
	}
</script>
</body>
</html>
